[workspace]
resolver = "3"
members = ["crates/lightdm-webkit-greeter", "crates/webkit-greeter-webext"]
default-members = ["crates/lightdm-webkit-greeter", "crates/webkit-greeter-webext"]

[workspace.package]
edition = "2024"
repository = "https://github.com/zaynchen/lightdm-webkit-greeter"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
jsc = { package = "jsc6", git = "https://github.com/zaynchen/webkit-greeter.git", version = "0.6" }
logger = { git = "https://github.com/zaynchen/webkit-greeter.git", version = "0.1" }
webkit = { package = "webkit6", version = "0.6" }
wwpe = { package = "webkit-web-process-extension6", version = "0.6" }
